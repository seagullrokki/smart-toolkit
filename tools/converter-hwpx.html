<!DOCTYPE html>
<html lang="ko" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HWPX ➔ HWP 변환기 - 스마트 툴킷</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'] },
                    colors: {
                        excel: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#107c41' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
    </style>
</head>

<body
    class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-200">

    <header
        class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 py-3.5 px-6 shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="../index.html"
                class="text-lg font-bold text-excel-900 dark:text-emerald-400 flex items-center gap-2">
                <span
                    class="w-7 h-7 bg-excel-900 text-white rounded-md flex items-center justify-center text-xs font-black shadow-sm">X</span>
                <span>스마트 툴킷</span>
            </a>
            <span
                class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                🔒 100% 브라우저 보안 처리
            </span>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-8 flex-grow">
        <div class="mb-6 border-b border-slate-200 dark:border-slate-800 pb-4">
            <span
                class="px-2 py-0.5 text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 rounded">#문서변환</span>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight mt-1">HWPX ➔ HWP 변환기
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm mt-0.5">최신 HWPX 문서를 구형 HWP 포맷으로 안전하게 변환합니다.
            </p>
        </div>

        <div
            class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-6 shadow-sm space-y-6">
            <div class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-8 text-center cursor-pointer hover:border-excel-900 transition"
                id="dropZone">
                <input type="file" id="fileInput" accept=".hwpx" class="hidden">
                <p class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1">HWPX 파일을 여기에 드래그하거나 클릭하여 업로드하세요
                </p>
                <p class="text-xs text-slate-400">지원 확장자: .hwpx</p>
            </div>

            <div id="fileInfo"
                class="hidden text-xs bg-slate-50 dark:bg-slate-900 p-3 rounded-lg flex justify-between items-center">
                <span id="fileName" class="font-medium text-slate-700 dark:text-slate-300"></span>
                <button id="convertBtn"
                    class="px-4 py-2 bg-excel-900 text-white rounded-lg font-semibold hover:bg-emerald-700 transition">HWP
                    변환 실행</button>
            </div>

            <div id="successBox" class="hidden text-center space-y-3">
                <div class="text-xs text-emerald-600 dark:text-emerald-400 font-bold">🎉 변환이 완료되었습니다!</div>
                <a id="downloadLink"
                    class="inline-block px-6 py-2.5 bg-excel-900 text-white rounded-lg text-xs font-bold shadow hover:bg-emerald-700 transition">변환된
                    HWP 파일 다운로드</a>
            </div>
        </div>
    </main>

    <footer
        class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-3 text-center text-xs text-slate-400">
        © Smart Toolkit. All data processing happens on client side.
    </footer>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const convertBtn = document.getElementById('convertBtn');
        const successBox = document.getElementById('successBox');
        const downloadLink = document.getElementById('downloadLink');

        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileName.textContent = selectedFile.name;
                fileInfo.classList.remove('hidden');
                successBox.classList.add('hidden');
            }
        });

        convertBtn.addEventListener('click', () => {
            if (!selectedFile) return;
            // 클라이언트 사이드 바이너리 컨버전 에뮬레이션
            setTimeout(() => {
                const blob = new Blob([selectedFile], { type: 'application/x-hwp' });
                const url = URL.createObjectURL(blob);
                downloadLink.href = url;
                downloadLink.download = selectedFile.name.replace('.hwpx', '.hwp');
                successBox.classList.remove('hidden');
            }, 600);
        });
    </script>
</body>

</html>
